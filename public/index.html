<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>what is my ip · ip.mlz.no</title>
  <meta name="description" content="Your public IP address — clean and fast." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#ebeff2" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#151619" media="(prefers-color-scheme: dark)" />
  <link rel="preload" as="font" type="font/woff2" href="fonts/rajdhani-700.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="fonts/ibm-plex-mono-400.woff2" crossorigin />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="panel">
    <section class="hero">
      <button id="ip" class="ip-display" type="button">
        <span id="ip-text" class="ip-text" aria-hidden="true"></span>
        <span id="ip-label" class="sr-only">Loading IP address</span>
      </button>

      <p id="meta" class="meta">
        <span id="meta-text" class="meta-text"></span>
        <span class="copy-hint copy-hint-fine" aria-hidden="true">click to copy · or press C</span>
        <span class="copy-hint copy-hint-coarse" aria-hidden="true">tap to copy</span>
      </p>
    </section>

    <p id="status" class="sr-only" role="status" aria-atomic="true"></p>
  </main>

  <footer class="curl">
    <button id="curl" class="curl-btn" type="button" title="Copy the command">
      <span id="curl-label" class="curl-label">curl ip.mlz.no/ip</span>
    </button>
  </footer>

  <noscript>
    <p class="meta">JavaScript is required to look up your IP address.</p>
  </noscript>

  <script src="script.js"></script>
</body>
</html>
