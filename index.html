<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>what is my ip</title>
  <meta name="description" content="Your public IP address — clean and fast." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23111'/><circle cx='8' cy='8' r='2.5' fill='%23a78bfa'/></svg>" />
  <link rel="preload" as="font" type="font/woff2" href="fonts/rajdhani-700.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="fonts/ibm-plex-mono-400.woff2" crossorigin />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="panel">
    <section class="hero">
      <button id="ip" class="ip-display" type="button">
        <span id="ip-text" class="ip-text" aria-hidden="true"></span>
        <span id="ip-label" class="sr-only">Loading IP address</span>
      </button>

      <div class="toggle" role="group" aria-label="IP version" data-version="v4">
        <span class="toggle-thumb" aria-hidden="true"></span>
        <button type="button" class="toggle-btn is-active" data-version="v4" aria-pressed="true">IPv4</button>
        <button type="button" class="toggle-btn" data-version="v6" aria-pressed="false">IPv6</button>
      </div>

      <!-- Below the control, not above it: this slot is empty at rest, and a
           reserved blank row between the IP and its toggle just pushed the two
           apart. As a status line it also belongs after the thing it reports on.

           The hint replaces the native `title` tooltip the IP used to carry: it
           lands in a row the layout already reserves, appears the moment the
           pointer arrives instead of a second later, and is the same voice as
           the "copied to clipboard" it precedes. Absolutely positioned so it
           can never push the status text off centre; aria-hidden because the
           button's own label already says "Copy IP address …". -->
      <p id="meta" class="meta">
        <span id="meta-text" class="meta-text"></span>
        <span class="copy-hint" aria-hidden="true">click to copy · or press C</span>
      </p>
    </section>

    <p id="status" class="sr-only" role="status" aria-atomic="true"></p>
  </main>

  <!-- Pinned to the viewport, not appended to the panel, so it can't nudge the
       hero off centre. Hidden on touch: no hover to reveal it, no shell to
       paste into. -->
  <footer class="curl">
    <button id="curl" class="curl-btn" type="button" title="Copy the command">
      <span id="curl-label" class="curl-label">curl ip.mlz.no</span>
    </button>
  </footer>

  <noscript>
    <p class="meta">JavaScript is required to look up your IP address.</p>
  </noscript>

  <script src="script.js"></script>
</body>
</html>
